<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Pedidos tienda SAVE</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS para Excel Local -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body { background-color: #f0f9ff; font-family: 'Segoe UI', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-down { transition: all 0.3s ease-out; overflow: hidden; max-height: 0; opacity: 0; }
        .slide-down.open { max-height: 100px; opacity: 1; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Configuración Fija ---
        const FIXED_WEBHOOK_URL = "https://hook.eu1.make.com/ddkg9fddcnuagi1ape9l3lteuiuceyjv";

        // --- Listas ---
        const TIENDAS = [
            "ECI Alicante", "ECI Bilbao", "ECI Callao", "ECI Castellana", "ECI Diagonal", 
            "ECI Goya", "ECI Las Palmas", "ECI Malaga", "ECI Mallorca", "ECI Marbella", "ECI Murcia", 
            "ECI Pamplona", "ECI Plaza Cataluña", "ECI Pozuelo", "ECI Princesa", 
            "ECI Sanchinarro", "ECI Santander", "ECI Sevilla", "ECI Valencia", 
            "SAVE El Paseo", "SAVE Fan Mallorca", "SAVE General Ricardos", "SAVE La Sierra"
        ];
        TIENDAS.sort();

        const PROVEEDORES = ["GSMParts", "Ecommerce", "Stock red"];

        // --- Iconos ---
        const Icon = ({ children, className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
        const Plus = ({ className }) => <Icon className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Trash2 = ({ className }) => <Icon className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const Save = ({ className }) => <Icon className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></Icon>;
        const Settings = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 0-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></Icon>;

        function App() {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [webhookUrl, setWebhookUrl] = useState(FIXED_WEBHOOK_URL);
            const [statusLog, setStatusLog] = useState(""); 
            
            // Estado del formulario
            const [formData, setFormData] = useState({ 
                tienda: '', 
                referencia: '', 
                etiqueta: '', 
                unidades: '', 
                proveedorTipo: '', 
                proveedorStockTienda: '', 
                observaciones: '',
                esTerminalTienda: false,
                esDeposito30: false,
                numeroPresupuesto: '',
                numeroFactura: ''
            });

            const handleConfigSave = (e) => {
                e.preventDefault();
                const url = e.target.url.value.trim();
                setWebhookUrl(url);
                localStorage.setItem('cloud_webhook_url', url);
                setShowSettings(false);
            };

            const handleAddItem = (e) => {
                e.preventDefault();
                if (!formData.tienda) return alert("Falta: TIENDA DE ORIGEN.");
                if (!formData.proveedorTipo) return alert("Falta: PROVEEDOR.");
                if (formData.proveedorTipo === 'Stock red' && !formData.proveedorStockTienda) return alert("Falta: Tienda de procedencia del Stock.");
                if (!formData.referencia || !formData.unidades) return alert("Faltan datos del producto.");
                
                // Validación lógica modificada:
                // Si solo Terminal está marcado -> Pide Presupuesto
                // Si Deposito está marcado (con o sin Terminal) -> Pide Factura
                if (formData.esTerminalTienda && !formData.esDeposito30 && !formData.numeroPresupuesto) return alert("Indica el Nº de Presupuesto.");
                if (formData.esDeposito30 && !formData.numeroFactura) return alert("Indica el Nº de Factura.");

                let proveedorFinal = formData.proveedorTipo;
                if (formData.proveedorTipo === 'Stock red') {
                    proveedorFinal = `Stock red - ${formData.proveedorStockTienda}`;
                }

                const newItem = {
                    id: Date.now(),
                    tienda: formData.tienda,
                    referencia: formData.referencia,
                    etiqueta: formData.etiqueta,
                    unidades: formData.unidades,
                    proveedor: proveedorFinal, 
                    observaciones: formData.observaciones,
                    terminalTienda: formData.esTerminalTienda ? 'Sí' : 'No',
                    deposito30: formData.esDeposito30 ? 'Sí' : 'No',
                    // Solo guardamos presupuesto si NO hay depósito
                    numeroPresupuesto: (formData.esTerminalTienda && !formData.esDeposito30) ? formData.numeroPresupuesto : '',
                    numeroFactura: formData.esDeposito30 ? formData.numeroFactura : ''
                };

                setItems(prev => [...prev, newItem]);
                
                // Limpieza inteligente: Mantener algunos valores puede ser útil, pero limpiamos los específicos del ítem
                setFormData(prev => ({ 
                    ...prev, 
                    referencia: '', etiqueta: '', unidades: '', observaciones: '',
                    esTerminalTienda: false, esDeposito30: false,
                    numeroPresupuesto: '', numeroFactura: ''
                }));
                document.getElementById('referencia').focus();
            };

            const handleDeleteItem = (id) => setItems(prev => prev.filter(item => item.id !== id));

            // Nueva lógica: NO son exclusivos
            const handleCheckboxChange = (name) => {
                setFormData(prev => {
                    if (name === 'terminal') {
                        return { ...prev, esTerminalTienda: !prev.esTerminalTienda };
                    } else if (name === 'deposito') {
                        return { ...prev, esDeposito30: !prev.esDeposito30 };
                    }
                    return prev;
                });
            };

            const handleProcess = async () => {
                if (items.length === 0) return alert("El pedido está vacío.");
                
                const targetUrl = FIXED_WEBHOOK_URL; 

                if(!confirm(`Se van a enviar ${items.length} líneas de pedido a la nube. ¿Continuar?`)) return;

                setLoading(true);
                setStatusLog("Iniciando proceso...");

                try {
                    const payload = {
                        fecha_envio: new Date().toLocaleDateString('es-ES'),
                        hora_envio: new Date().toLocaleTimeString('es-ES'),
                        total_lineas: items.length,
                        items: items
                    };

                    setStatusLog("Enviando datos a Make (Cloud)...");
                    
                    await fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, 
                        body: JSON.stringify(payload)
                    });

                    setStatusLog("Datos enviados a la nube.");

                    setStatusLog("Generando copia local Excel...");
                    const wsData = items.map(item => ({ 
                        "Tienda Origen": item.tienda,
                        "Referencia": item.referencia, 
                        "Etiqueta": item.etiqueta, 
                        "Unidades": Number(item.unidades), 
                        "Proveedor": item.proveedor,
                        "Terminal en Tienda": item.terminalTienda,
                        "Nº Presupuesto": item.numeroPresupuesto,
                        "Depósito 30%": item.deposito30,
                        "Nº Factura": item.numeroFactura,
                        "Observaciones": item.observaciones
                    }));
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.json_to_sheet(wsData);
                    ws['!cols'] = [{wch: 20}, {wch: 15}, {wch: 30}, {wch: 8}, {wch: 25}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 30}];
                    XLSX.utils.book_append_sheet(wb, ws, "Pedido");
                    
                    const fileName = `Copia_Local_Pedido_${new Date().toISOString().split('T')[0]}_${Date.now()}.xlsx`;
                    XLSX.writeFile(wb, fileName);

                    setStatusLog("¡Proceso completado con éxito!");
                    alert("✅ ¡PEDIDO ENVIADO!\n\n1. Datos subidos a la nube.\n2. Copia Excel descargada.");

                    if(confirm("¿Deseas limpiar la lista para un nuevo pedido?")) {
                        setItems([]);
                        setStatusLog("");
                    }

                } catch (error) {
                    console.error("Error envío:", error);
                    setStatusLog("Error: " + error.message);
                    alert("❌ Hubo un error al enviar. Revisa el mensaje abajo.\n\n" + error.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center py-10 px-4">
                    {/* Configuración Oculta */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full">
                                <h3 className="text-xl font-bold mb-4 flex items-center text-blue-700"><Settings className="mr-2"/> Configuración Avanzada</h3>
                                <form onSubmit={handleConfigSave}>
                                    <label className="text-xs font-bold text-gray-600">Webhook URL</label>
                                    <input name="url" defaultValue={webhookUrl} className="w-full border p-2 rounded text-sm mb-4"/>
                                    <div className="flex justify-end space-x-2">
                                        <button type="button" onClick={()=>setShowSettings(false)} className="px-3 py-2 bg-gray-200 rounded text-sm">Cerrar</button>
                                        <button type="submit" className="px-3 py-2 bg-blue-600 text-white rounded text-sm">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Cabecera */}
                    <div className="max-w-6xl w-full bg-white rounded-xl shadow-lg mb-6 overflow-hidden border-b-4 border-blue-500">
                        <div className="bg-gradient-to-r from-blue-600 to-cyan-600 p-6 flex justify-between items-center text-white">
                            <div className="flex items-center">
                                <img src="logo save.jpg" alt="Logo SAVE" className="h-12 w-auto mr-4 rounded-md object-contain bg-white p-1 shadow-sm" onError={(e)=>{e.target.style.display='none'}} />
                                <div><h1 className="text-2xl font-bold">Gestion Pedidos tienda SAVE</h1></div>
                            </div>
                            <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-white/20 rounded-full transition opacity-50 hover:opacity-100"><Settings className="h-6 w-6 text-white" /></button>
                        </div>
                    </div>

                    <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Panel Izquierdo */}
                        <div className="lg:col-span-1 space-y-6">
                            <div className="bg-white rounded-xl shadow-md p-6">
                                <h2 className="font-semibold mb-4 flex items-center text-gray-800"><Plus className="h-5 w-5 mr-2 text-blue-600"/> Añadir Producto</h2>
                                <form onSubmit={handleAddItem} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1 ml-1">TIENDA QUE PIDE (ORIGEN)</label>
                                        <select name="tienda" value={formData.tienda} onChange={(e)=>setFormData({...formData, tienda: e.target.value})} className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500 bg-blue-50 text-blue-900 font-bold">
                                            <option value="">-- Selecciona tu Tienda --</option>
                                            {TIENDAS.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded border border-gray-200">
                                        <label className="block text-xs font-bold text-gray-500 mb-1 ml-1">PROVEEDOR</label>
                                        <select value={formData.proveedorTipo} onChange={(e)=>setFormData({...formData, proveedorTipo: e.target.value, proveedorStockTienda: ''})} className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500 bg-white mb-1">
                                            <option value="">-- Selecciona Proveedor --</option>
                                            {PROVEEDORES.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                        <div className={`slide-down ${formData.proveedorTipo === 'Stock red' ? 'open' : ''}`}>
                                            <label className="block text-xs font-bold text-red-500 mb-1 ml-1 mt-2">¿De qué tienda viene el stock?</label>
                                            <select value={formData.proveedorStockTienda} onChange={(e)=>setFormData({...formData, proveedorStockTienda: e.target.value})} className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-red-500 bg-white border-red-200">
                                                <option value="">-- Selecciona Tienda --</option>
                                                {TIENDAS.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <input name="referencia" value={formData.referencia} onChange={(e)=>setFormData({...formData, referencia: e.target.value})} id="referencia" className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500" placeholder="Referencia" />
                                    <input name="etiqueta" value={formData.etiqueta} onChange={(e)=>setFormData({...formData, etiqueta: e.target.value})} className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500" placeholder="Descripción / Etiqueta" />
                                    <input type="number" name="unidades" value={formData.unidades} onChange={(e)=>setFormData({...formData, unidades: e.target.value})} className="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500" placeholder="Unidades" />

                                    <div className="bg-indigo-50 p-3 rounded border border-indigo-100 space-y-3">
                                        <div className="flex items-center space-x-4">
                                            {/* Checkboxes ahora independientes */}
                                            <label className="flex items-center space-x-2 cursor-pointer"><input type="checkbox" checked={formData.esTerminalTienda} onChange={() => handleCheckboxChange('terminal')} className="form-checkbox h-4 w-4 text-blue-600"/><span className="text-xs font-bold text-gray-700">Terminal en tienda</span></label>
                                            <label className="flex items-center space-x-2 cursor-pointer"><input type="checkbox" checked={formData.esDeposito30} onChange={() => handleCheckboxChange('deposito')} className="form-checkbox h-4 w-4 text-blue-600"/><span className="text-xs font-bold text-gray-700">Depósito 30%</span></label>
                                        </div>
                                        
                                        {/* Lógica de visualización: Si Terminal=SI y Deposito=NO -> Muestra Presupuesto */}
                                        <div className={`slide-down ${formData.esTerminalTienda && !formData.esDeposito30 ? 'open' : ''}`}>
                                            <input value={formData.numeroPresupuesto} onChange={(e)=>setFormData({...formData, numeroPresupuesto: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="Nº Presupuesto"/>
                                        </div>
                                        
                                        {/* Lógica de visualización: Si Deposito=SI (tenga o no Terminal) -> Muestra Factura */}
                                        <div className={`slide-down ${formData.esDeposito30 ? 'open' : ''}`}>
                                            <input value={formData.numeroFactura} onChange={(e)=>setFormData({...formData, numeroFactura: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="Nº Factura"/>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1 ml-1">OBSERVACIONES</label>
                                        <textarea value={formData.observaciones} onChange={(e)=>setFormData({...formData, observaciones: e.target.value})} className="w-full border p-2 rounded h-20 text-sm resize-none" placeholder="Notas..."/>
                                    </div>

                                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-bold shadow flex justify-center items-center"><Plus className="mr-2 h-5 w-5"/> Añadir a lista</button>
                                </form>
                            </div>
                        </div>

                        {/* Panel Derecho */}
                        <div className="lg:col-span-2 flex flex-col bg-white rounded-xl shadow-md overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                                <h2 className="font-semibold flex items-center text-gray-700">Resumen <span className="ml-2 bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full">{items.length}</span></h2>
                            </div>
                            <div className="flex-grow overflow-auto p-0 min-h-[400px]">
                                {items.length === 0 ? <div className="h-full flex flex-col items-center justify-center text-gray-400 opacity-50"><span className="text-4xl mb-2">🛒</span>Lista vacía</div> : 
                                    <table className="min-w-full divide-y divide-gray-200">
                                        <thead className="bg-gray-50 sticky top-0 z-10">
                                            <tr>
                                                <th className="px-4 py-3 text-left text-xs text-gray-500 font-bold uppercase">Origen</th>
                                                <th className="px-4 py-3 text-left text-xs text-gray-500 uppercase">Producto</th>
                                                <th className="px-4 py-3 text-left text-xs text-gray-500 uppercase">Detalles</th>
                                                <th className="px-4 py-3 uppercase text-xs text-gray-500">Uds</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">{items.map(item => (
                                            <tr key={item.id} className="hover:bg-gray-50 group">
                                                <td className="px-4 py-3 text-xs font-bold text-blue-800 bg-blue-50/30 whitespace-nowrap">{item.tienda}</td>
                                                <td className="px-4 py-3">
                                                    <div className="text-sm font-medium text-gray-900">{item.referencia}</div>
                                                    <div className="text-xs text-gray-500 truncate max-w-[150px]">{item.etiqueta}</div>
                                                    <div className="text-xs text-gray-400 mt-1 italic">{item.proveedor}</div>
                                                </td>
                                                <td className="px-4 py-3 text-xs">
                                                    {item.terminalTienda === 'Sí' && <span className="block mb-1 text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded font-medium">Term. Tienda{item.numeroPresupuesto ? `: ${item.numeroPresupuesto}` : ''}</span>}
                                                    {item.deposito30 === 'Sí' && <span className="block mb-1 text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded font-medium">Depósito{item.numeroFactura ? `: ${item.numeroFactura}` : ''}</span>}
                                                    <span className="text-gray-500 italic truncate block max-w-[150px]" title={item.observaciones}>{item.observaciones || '-'}</span>
                                                </td>
                                                <td className="px-4 py-3 text-sm font-bold text-center">{item.unidades}</td>
                                                <td className="px-4 text-right"><button onClick={()=>handleDeleteItem(item.id)} className="text-red-300 hover:text-red-600"><Trash2 className="h-4 w-4"/></button></td>
                                            </tr>
                                        ))}</tbody>
                                    </table>
                                }
                            </div>
                            <div className="p-4 bg-gray-50 border-t">
                                <div className="mb-2 text-xs text-gray-500 text-right h-4">{statusLog}</div>
                                <button onClick={handleProcess} disabled={items.length===0 || loading} className={`w-full flex items-center justify-center px-6 py-4 rounded-lg font-bold text-white shadow-lg transition transform active:scale-95 ${items.length===0 ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700'}`}>
                                    {loading ? "Enviando..." : <span className="flex items-center"><Save className="mr-2 h-5 w-5"/> Enviar pedido</span>}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
